worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    keepalive_timeout 30;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;

    log_format safe '$request_id method=$request_method uri=$uri status=$status bytes=$body_bytes_sent duration=$request_time';
    access_log /dev/stdout safe;

    map $http_x_forwarded_for $lootwright_forwarded_for {
        "" $remote_addr;
        default "$http_x_forwarded_for, $remote_addr";
    }

    map $http_x_forwarded_proto $lootwright_forwarded_proto {
        "https" https;
        default $scheme;
    }

    server {
        listen 8080;
        server_name _;
        root /app/public;
        index index.php;
        client_max_body_size 1100k;

        location ^~ /storage/ {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /app/public/index.php;
            fastcgi_param HTTP_X_FORWARDED_FOR $lootwright_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $lootwright_forwarded_proto;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_read_timeout 40s;
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}

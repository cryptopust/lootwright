name: lootwright

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    ports:
      - '${APP_PORT:-8000}:8000'
      - '${VITE_PORT:-5173}:5173'
    environment:
      APP_ENV: local
      APP_URL: 'http://localhost:${APP_PORT:-8000}'
      DB_CONNECTION: pgsql
      DB_HOST: pgsql
      DB_PORT: 5432
      DB_DATABASE: '${DB_DATABASE:-lootwright}'
      DB_USERNAME: '${DB_USERNAME:-lootwright_app}'
      DB_PASSWORD: '${DB_PASSWORD:-lootwright-local}'
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: '${REDIS_PASSWORD:-lootwright-redis-local}'
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      VITE_DEV_SERVER_HOST: 0.0.0.0
      VITE_DEV_SERVER_URL: 'http://localhost:${VITE_PORT:-5173}'
    volumes:
      - .:/app
      - lootwright-vendor:/app/vendor
      - lootwright-node-modules:/app/node_modules
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'php',
          '-r',
          "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  pgsql:
    image: postgres:18-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_DB: '${DB_DATABASE:-lootwright}'
      POSTGRES_USER: '${DB_ADMIN_USERNAME:-lootwright_admin}'
      POSTGRES_PASSWORD: '${DB_ADMIN_PASSWORD:-lootwright-admin-local}'
      APP_DB_USERNAME: '${DB_USERNAME:-lootwright_app}'
      APP_DB_PASSWORD: '${DB_PASSWORD:-lootwright-local}'
    volumes:
      - lootwright-postgres:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: '${REDIS_PASSWORD:-lootwright-redis-local}'
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:-lootwright-redis-local}',
      ]
    volumes:
      - lootwright-redis:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$${REDIS_PASSWORD:-lootwright-redis-local}" --no-auth-warning ping',
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lootwright-postgres:
  lootwright-redis:
  lootwright-vendor:
  lootwright-node-modules:
